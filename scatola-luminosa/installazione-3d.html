<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scatola luminosa – installazione passo passo (3D)</title>
<style>
  html,body{margin:0;height:100%;background:#15181f;color:#e8eaee;font:14px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;overflow:hidden}
  #c{position:fixed;inset:0;width:100%;height:100%;display:block}
  #side{position:fixed;left:12px;top:12px;width:250px;max-height:calc(100vh - 24px);overflow:auto;background:rgba(20,22,28,.88);border:1px solid #333845;border-radius:12px;padding:12px 10px;backdrop-filter:blur(6px)}
  #side h1{font-size:14px;margin:0 6px 8px}
  #steps{list-style:none;margin:0;padding:0}
  #steps li{display:flex;gap:8px;align-items:flex-start;padding:7px 8px;border-radius:8px;cursor:pointer;color:#aeb6c6;font-size:13px}
  #steps li span{flex:0 0 20px;height:20px;border-radius:50%;background:#2b3040;text-align:center;line-height:20px;font-size:11px;font-weight:700}
  #steps li.done span{background:#3d6b4a;color:#fff}
  #steps li.on{background:#2a2f3d;color:#fff}#steps li.on span{background:#f2c14e;color:#111}
  #card{position:fixed;right:12px;top:12px;width:330px;max-width:calc(100vw - 300px);background:rgba(20,22,28,.9);border:1px solid #333845;border-radius:12px;padding:14px 16px;backdrop-filter:blur(6px)}
  #stitle{font-weight:700;font-size:15px;margin-bottom:6px;color:#f2c14e}
  #sdesc{font-size:13.5px;color:#dfe3ec}
  #bar{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);display:flex;align-items:center;gap:10px;background:rgba(20,22,28,.9);border:1px solid #333845;border-radius:40px;padding:8px 18px}
  #bar button{background:#2a2f3d;color:#fff;border:0;border-radius:50%;width:40px;height:40px;font-size:17px;cursor:pointer}
  #bar button:hover{background:#3a4156}#play{background:#f2c14e!important;color:#111!important}
  #bar label{font-size:12px;color:#9aa3b5}#hint{position:fixed;right:14px;bottom:20px;font-size:12px;color:#7d869a}
  #tools{position:fixed;left:50%;bottom:76px;transform:translateX(-50%);display:flex;gap:8px;flex-wrap:wrap;justify-content:center;max-width:calc(100vw - 24px)}
  #tools button{background:rgba(34,38,50,.92);color:#e8eaee;border:1px solid #3a4156;border-radius:20px;padding:7px 14px;font-size:13px;cursor:pointer}
  #tools button:hover{background:#3a4156}#tools button.act{background:#f2c14e;color:#111;border-color:#f2c14e;font-weight:600}
  #tools #hide{font-weight:600}
  .lbl{position:fixed;left:0;top:0;pointer-events:none;white-space:nowrap;font-size:12px;font-weight:600;background:#f2c14e;color:#161616;padding:1px 6px;border-radius:5px;margin:-22px 0 0 8px;display:none;z-index:5}
  @media(max-width:760px){#side{display:none}#card{max-width:calc(100vw - 24px);left:12px;width:auto}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="labels"></div>
<div id="side"><h1>Installazione passo passo</h1><ol id="steps"></ol></div>
<div id="card"><div id="stitle"></div><div id="sdesc"></div></div>
<div id="tools"><button id="hide">Nascondi struttura</button><button id="lab">Etichette: sì</button><button id="vTop">Vista dall'alto</button><button id="vWall">Vista lato lungo</button><button id="vBack">Vista spine USB</button><button id="vIso">Vista generale</button></div>
<div id="bar"><button id="prev" title="Indietro">⏮</button><button id="play" title="Play / pausa">⏸</button><button id="next" title="Avanti">⏭</button><label>velocità <input id="speed" type="range" min="0.5" max="2.5" step="0.1" value="1"></label></div>
<div id="hint">trascina per ruotare · rotellina per zoom · spazio = play/pausa · ← → = passi · S = nascondi struttura</div>
